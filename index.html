<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI勉強会のお知らせ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="announcement" aria-labelledby="event-title">
      <section class="event-card">
        <div class="hero">
          <img
            class="hero-visual"
            src="assets/ai-workshop-visual.svg"
            alt="AI勉強会を表すデモビジュアル"
          />
          <div class="hero-content">
            <span class="eyebrow">Internal AI Workshop</span>
            <span class="demo-badge">Demo Visual</span>
          </div>
        </div>

        <section class="event-details" aria-label="イベント詳細">
          <div class="detail-item title-item">
            <p class="detail-label">タイトル</p>
            <h1 id="event-title">明後日から使えるAI活用勉強会</h1>
          </div>
          <div class="detail-item">
            <p class="detail-label">開催日時</p>
            <p class="detail-text">2026年9月18日（金） 15:00〜16:30</p>
          </div>
          <div class="detail-item">
            <p class="detail-label">場所</p>
            <p class="detail-text">本社 7F ラウンジ &amp; オフラインのみ</p>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
